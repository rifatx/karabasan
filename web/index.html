<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>karabasan.exe</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <section id="terminal" aria-label="Sohbet terminali" tabindex="0">
      <div id="transcript" role="log" aria-live="polite" aria-relevant="additions"></div>
      <form id="chat-form" autocomplete="off">
        <label id="prompt" class="sr-only" for="answer">yükleniyor…</label>
        <span aria-hidden="true">&gt;</span>
        <input id="answer" name="answer" type="text" maxlength="256"
          spellcheck="false" autocapitalize="off" enterkeyhint="send" disabled>
      </form>
    </section>
    <span id="status" class="sr-only" role="status">yükleniyor…</span>
  </main>
</body>
</html>
